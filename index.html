<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00379e">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Banheiros Químicos · Fagundes</title>
<style>
:root{
  --az:#00379e;--az2:#0b4fc9;--az-cl:#e9effc;--az-esc:#00256b;--vd:#95d324;--vd-esc:#4f7d0a;--cz:#98989a;
  --bg:#eef1f6;--card:#fff;--tx:#141b2b;--tx2:#545d6f;--tx3:#8a91a0;--bd:#e2e6ee;--bd2:#cfd5e0;
  --ok:#1f8f3a;--warn:#c97a00;--err:#c93434;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  --r:14px;--sh:0 1px 2px rgba(16,30,60,.06),0 2px 8px rgba(16,30,60,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* ---------- topo ---------- */
header{position:sticky;top:0;z-index:30;background:linear-gradient(100deg,var(--az-esc),var(--az) 55%,#0a4fc0);color:#fff;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,30,90,.25)}
.logo{display:flex;align-items:center;gap:7px;font-weight:800;font-style:italic;letter-spacing:.6px;font-size:17px;white-space:nowrap}
.logo svg{width:40px;height:22px}
.htit{flex:1;min-width:0;border-left:1px solid rgba(255,255,255,.3);padding-left:12px;line-height:1.15}
.htit b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htit span{font-size:11.5px;opacity:.8}
.pill{font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;background:rgba(255,255,255,.14);white-space:nowrap;display:flex;align-items:center;gap:6px}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--cz)}
.pill.on i{background:var(--vd)}.pill.off i{background:#ff7676}.pill.sync i{background:#ffd34d;animation:pisca 1s infinite}
@keyframes pisca{50%{opacity:.3}}
.uchip{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.12);border:0;border-radius:22px;padding:3px 10px 3px 3px;color:#fff;cursor:pointer}
.uchip .av{width:30px;height:30px;font-size:12px}
.uchip small{font-size:12px;font-weight:600;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.uchip small,.pill span,.htit span{display:none}.logo{font-size:0;gap:0}}
/* ---------- estrutura ---------- */
.shell{display:flex;min-height:calc(100vh - 56px)}
aside{display:none}
main{flex:1;min-width:0;max-width:1180px;margin:0 auto;padding:18px 14px calc(96px + env(safe-area-inset-bottom))}
main.estreito{max-width:780px}
nav.bot{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);box-shadow:0 -2px 10px rgba(16,30,60,.06)}
nav.bot button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:10.5px;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;cursor:pointer}
nav.bot button.at{color:var(--az);font-weight:700}
nav.bot button.at::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;background:var(--vd);border-radius:0 0 3px 3px}
.bdg{position:absolute;top:2px;left:56%;background:var(--err);color:#fff;font-size:10px;font-weight:700;border-radius:10px;padding:1px 5px;line-height:1.3}
@media(min-width:980px){
  aside{display:flex;flex-direction:column;gap:4px;width:224px;flex:none;background:#fff;border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:56px;height:calc(100vh - 56px)}
  aside button{display:flex;align-items:center;gap:11px;border:0;background:none;padding:11px 12px;border-radius:10px;font-size:14.5px;color:var(--tx2);cursor:pointer;text-align:left;position:relative}
  aside button:hover{background:#f3f5f9}
  aside button.at{background:var(--az-cl);color:var(--az);font-weight:700}
  aside button.at::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--az)}
  aside .bdg{position:static;margin-left:auto}
  aside .rod{margin-top:auto;font-size:11.5px;color:var(--tx3);padding:10px 12px;font-style:italic}
  body.adm nav.bot{display:none}
  body.adm main{padding-bottom:40px}
}
/* ---------- elementos ---------- */
h1{font-size:22px;margin:0 0 4px;color:var(--tx)}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 10px;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px}
.sub{color:var(--tx2);font-size:13.5px;margin:0 0 16px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:14px;box-shadow:var(--sh);border:1px solid var(--bd)}
.card.p0{padding:0;overflow:hidden}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.f1{flex:1;min-width:0}
.muted{color:var(--tx2);font-size:13px}
.tiny{font-size:12px;color:var(--tx3)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:11px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--az);color:#fff;min-height:44px;text-decoration:none;font-size:14.5px;transition:filter .15s}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#fff;color:var(--az);border:1.5px solid var(--bd2)}
.btn.vd{background:var(--vd);color:#18320a}
.btn.ghost{background:transparent;color:var(--az);padding:7px 10px;min-height:34px}
.btn.perigo{background:#fff;color:var(--err);border:1.5px solid #f0c4c4}
.btn.bl{width:100%}
.btn.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--bd2);border-radius:10px;background:#fff;color:var(--tx);min-height:44px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--az2);outline-offset:-1px;border-color:transparent}
select.mini{width:auto;min-height:38px;padding:6px 10px;font-size:14px}
.campo{margin-bottom:13px}.campo:last-child{margin-bottom:0}
.campo>label,.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--tx2);margin-bottom:5px}
.req{color:var(--err)}
.err-campo input,.err-campo textarea,.err-campo select,.err-campo .chips{outline:2px solid var(--err);outline-offset:1px;border-radius:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:440px){.grid2.r{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:20px;border:1px solid var(--bd2);background:#fff;font-size:14px;cursor:pointer;user-select:none}
.chip input:checked+span{background:var(--az);color:#fff;border-color:var(--az)}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.tabs button{border:1px solid var(--bd2);background:#fff;border-radius:20px;padding:7px 14px;font-size:13px;white-space:nowrap;cursor:pointer}
.tabs button.at{background:var(--az);color:#fff;border-color:var(--az)}
.av{width:44px;height:44px;border-radius:50%;background:var(--az);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none}
.st{font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.st.pendente,.st.aberta{background:#fff1d6;color:#8a5800}
.st.sincronizado,.st.concluida{background:#e1f3e5;color:#17702f}
.st.rejeitado,.st.vencida{background:#fbe1e1;color:#a52525}
.st.cancelado{background:#eceef2;color:#666}
.aviso{background:#fff7e3;border:1px solid #f0d58e;color:#6e4b00;border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:14px;display:flex;gap:9px;align-items:flex-start}
.info{background:var(--az-cl);border-radius:12px;padding:11px 13px;font-size:13.5px;margin-bottom:14px;color:#1b3a78}
.vazio{text-align:center;color:var(--tx2);padding:34px 10px}
.vazio svg.i{width:38px;height:38px;color:var(--cz);margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:#141b2b;color:#fff;padding:12px 16px;border-radius:12px;font-size:14px;z-index:99;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:sobe .2s}
.toast.erro{background:var(--err)}.toast.ok{background:var(--ok)}
@keyframes sobe{from{opacity:0;transform:translate(-50%,10px)}}
.modal{position:fixed;inset:0;background:rgba(10,20,40,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}
.modal-c{background:#fff;border-radius:16px;padding:20px;max-width:440px;width:100%;box-shadow:0 14px 40px rgba(0,0,0,.3);max-height:90vh;overflow:auto}
.modal-c h2{margin-top:0}
/* ---------- login ---------- */
.login-bg{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 20% 0%,#1d5fd6 0,transparent 55%),linear-gradient(160deg,var(--az-esc),var(--az))}
.login{background:#fff;border-radius:20px;padding:26px 22px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,20,70,.35)}
.login .marca{display:flex;align-items:center;gap:10px;color:var(--az);font-weight:800;font-style:italic;font-size:22px;letter-spacing:.6px;margin-bottom:4px}
.login .marca svg{width:52px;height:28px}
.login .tit{font-size:14px;color:var(--tx2);margin-bottom:22px}
.login .slogan{text-align:center;color:var(--cz);font-size:12px;margin-top:18px;font-style:italic}
.senha{position:relative}.senha button{position:absolute;right:6px;top:6px;border:0;background:none;color:var(--tx3);padding:6px;cursor:pointer}
/* ---------- lançar ---------- */
.hello{display:flex;gap:14px;align-items:center;background:linear-gradient(120deg,#fff,#f4f7fd);}
.hello .av{width:52px;height:52px;font-size:19px}
.syncbar{display:flex;align-items:center;gap:12px}
.syncbar .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#e1f3e5;color:var(--ok);flex:none}
.syncbar.pend .ic{background:#fff1d6;color:var(--warn)}
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:14px}
.doc{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;text-align:left;cursor:pointer;display:flex;gap:14px;align-items:center;box-shadow:var(--sh);transition:transform .1s,box-shadow .15s;position:relative;overflow:hidden}
.doc::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.doc:hover{box-shadow:0 6px 18px rgba(16,30,60,.12)}
.doc:active{transform:scale(.99)}
.doc .di{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:none;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.doc .di svg.i{width:26px;height:26px}
.doc b{display:block;font-size:15.5px;color:var(--tx)}
.doc small{display:block;color:var(--tx2);font-size:12.5px;margin-top:2px}
.doc code{font-size:11px;color:var(--tx3);font-family:inherit}
.doc .seta{margin-left:auto;color:var(--tx3)}
/* ---------- formulário ---------- */
.fhead{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.fhead .di{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.sec{background:#fff;border-radius:var(--r);margin-bottom:12px;box-shadow:var(--sh);border:1px solid var(--bd);overflow:hidden}
.sec-t{color:var(--az);font-weight:700;padding:11px 16px;font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--bd);background:#fafbfd;display:flex;align-items:center;gap:8px}
.sec-t::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--vd)}
.sec-b{padding:14px 16px}
.cnt-gt{font-weight:700;font-size:13px;color:var(--az);margin:10px 0 4px}
.cnt{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--bd)}
.cnt .n{flex:1;font-size:14px}.cnt .n b{color:var(--az);margin-right:5px}
.cnt button{width:40px;height:40px;border-radius:10px;border:1px solid var(--bd2);background:#fff;font-size:20px;font-weight:700;color:var(--az);cursor:pointer}
.cnt output{min-width:28px;text-align:center;font-weight:800;font-size:17px}
.cnt output.nz{color:var(--err)}
.linha{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px;background:#fafbfd}
.linha-h{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:13px;color:var(--az);margin-bottom:8px}
.calc{background:var(--az-cl);border-radius:12px;padding:12px}
.calc table{width:100%;border-collapse:collapse;font-size:13px}
.calc td,.calc th{padding:5px 6px;border-bottom:1px solid #d3dcf0;text-align:center}
.calc th{color:var(--az)}
.ips-res{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.ips-res .v{font-size:30px;font-weight:800}
.classe{font-weight:800;padding:5px 12px;border-radius:8px;color:#fff;font-size:12.5px;display:inline-block}
.c-EXCELENTE{background:#1f8f3a}.c-BOM{background:#5f9a12}.c-REGULAR{background:#c98a00}.c-INSATISFATÓRIO{background:#c93434}.c-—{background:#999}
.ajuda{font-size:12px;color:var(--tx2);background:#f6f7fa;border-radius:10px;padding:9px 11px;margin-top:8px}
.ajuda b{color:var(--tx)}
.barra-acoes{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));display:flex;gap:10px;background:linear-gradient(transparent,var(--bg) 35%);padding:16px 0 4px;z-index:5}
@media(min-width:980px){body.adm .barra-acoes{bottom:0}}
.barra-acoes .btn{flex:1}
/* ---------- listas ---------- */
.item{background:#fff;border:1px solid var(--bd);border-radius:13px;padding:12px 13px;margin-bottom:8px;display:flex;gap:12px;align-items:center;cursor:pointer}
.item:hover{border-color:var(--bd2)}
.item .di{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);flex:none}
.item .t{font-weight:700;font-size:14px}
.item .s{font-size:12.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
table.tb th,table.tb td{border-bottom:1px solid var(--bd);padding:8px 7px;text-align:left;vertical-align:top}
table.tb th{color:var(--tx2);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px;background:#fafbfd;position:sticky;top:0}
table.tb td.n,table.tb th.n{text-align:right;font-variant-numeric:tabular-nums}
table.tb tr.cl{cursor:pointer}table.tb tr.cl:hover td{background:#f7f9fd}
.tbw{overflow-x:auto;max-height:520px;overflow-y:auto}
.det dt{font-size:12px;color:var(--tx2);font-weight:600;margin-top:10px}
.det dd{margin:2px 0 0;white-space:pre-wrap;word-break:break-word}
/* ---------- painel ---------- */
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;margin-bottom:14px;box-shadow:var(--sh)}
.filtros .lb{font-size:12px;color:var(--tx3);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:#fff;border-radius:var(--r);padding:14px 15px;border:1px solid var(--bd);box-shadow:var(--sh);position:relative}
.kpi .l{font-size:12px;color:var(--tx2);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .l svg.i{width:16px;height:16px;color:var(--az)}
.kpi .v{font-size:30px;font-weight:800;line-height:1.15;margin-top:6px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--tx2);margin-top:2px}
.kpi .d .up{color:var(--ok);font-weight:700}.kpi .d .dn{color:var(--err);font-weight:700}
.grid-p{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.grid-p>.card{margin:0}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
@media(max-width:900px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
.ch-t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch-t b{font-size:15px}
.leg{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--tx2)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.colchart{position:relative;height:200px;display:flex;align-items:flex-end;gap:3px;padding-left:30px;border-bottom:1px solid var(--bd2)}
.colchart .gl{position:absolute;left:30px;right:0;border-top:1px dashed #e3e7ee;font-size:10.5px;color:var(--tx3)}
.colchart .gl span{position:absolute;left:-30px;top:-7px;width:26px;text-align:right}
.colchart .ccol{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center;position:relative;cursor:default;min-width:0}
.colchart .ccol:hover{background:rgba(0,55,158,.05)}
.colchart .stack{width:min(80%,26px);display:flex;flex-direction:column-reverse;gap:2px}
.colchart .stack i{display:block;min-height:2px}
.colchart .stack i:last-child{border-radius:4px 4px 0 0}
.xlab{display:flex;gap:3px;padding-left:30px;font-size:10.5px;color:var(--tx3);margin-top:4px}
.xlab span{flex:1;text-align:center;white-space:nowrap;overflow:visible;min-width:0}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr 42px;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.hb .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--tx)}
.hb .tr{height:14px;background:#f0f2f6;border-radius:0 4px 4px 0;position:relative}
.hb .br{height:100%;border-radius:0 4px 4px 0;min-width:2px}
.hb .vl{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.distr{display:flex;height:30px;gap:2px;border-radius:6px;overflow:hidden;margin:6px 0 10px}
.distr i{display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;font-style:normal;min-width:2px}
svg.lc{width:100%;height:auto;display:block}
svg.lc text{font-size:11px;fill:var(--tx3);font-family:inherit}
.tip{position:fixed;z-index:120;background:#141b2b;color:#fff;font-size:12.5px;padding:8px 10px;border-radius:9px;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:260px;line-height:1.4}
.tip b{color:#fff}
.pess{background:#fff;border:1px solid var(--bd);border-left:5px solid var(--ok);border-radius:13px;padding:12px 13px;margin-bottom:8px}
.pess.s-pend{border-left-color:var(--warn)}.pess.s-perda{border-left-color:var(--err)}.pess.s-sem{border-left-color:#e07b39}.pess.s-nunca{border-left-color:var(--cz)}
.pess .t{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tag{display:inline-block;font-size:11.5px;background:#eef1f6;border-radius:6px;padding:2px 8px;margin:4px 4px 0 0}
.alerta{background:#fdeeee;color:#a32020;border-radius:9px;padding:8px 10px;font-size:12.5px;margin-top:8px}
.semlanc{display:flex;flex-wrap:wrap;gap:6px}

/* =================== v3 – identidade Fagundes =================== */
.marca-f{display:inline-flex;align-items:center;gap:9px;line-height:1}
.marca-f svg{height:24px;width:auto;flex:none}

  const repAnd=rep.filter(r=>r.situacao==='Em andamento').sort((a,b)=>b.ini-a.ini)[0];

  const venceEm=base?base+freq*3600e3:0,atrasoH=base?(agoraMs-venceEm)/3600e3:null;

  let k='ok',motivo='';
  if(!b.ativo){k='ina';motivo='Banheiro inativado';}
  else if(repAnd&&repAnd.fimMs>ultRepConc){k='man';motivo='Reparo em andamento desde '+fDT(repAnd.ini)+(repAnd.descReparo?' – '+repAnd.descReparo:'');}
  else if(sinRep.length){k='rep';motivo=sinRep[0].d;}

  else if(base&&atrasoH>0){k='limp';motivo=ultLimp?`Última limpeza há ${fN((agoraMs-ultLimp)/3600e3)} h (frequência ${freq} h)`:'Nenhuma limpeza registrada desde a disponibilização';}

  autor:{nome:S.user.nome,matricula:S.user.matricula,perfil:S.user.perfil},auth:S.auth};

async function sincronizar(manual){
 if(S.syncing)return;
 if(!temServidor()){if(manual)toast('Servidor não configurado neste aparelho','erro');return;}
 if(!online()){if(manual)toast('Sem internet — tudo continua guardado no aparelho');renderStatus();return;}
 S.syncing=true;renderStatus();let enviados=0,fotos=0,recusados=0,mudou=!!manual;
 try{
  await recarregarFila();
  /* 1) lançamentos e cadastros, na ordem em que foram feitos */
  const pend=S.fila.filter(r=>r.status==='pendente');
  for(let i=0;i<pend.length;i+=50){
   const lote=pend.slice(i,i+50);
   const res=await api({action:'sync',deviceId:S.deviceId,records:lote.map(paraEnvio)},90000);
   const acks=new Set(res.acks||[]),rej={};(res.rejeitados||[]).forEach(x=>rej[x.id]=x.motivo);
   const mud=[];for(const r of lote){
    if(acks.has(r.id)){r.status='sincronizado';r.sincronizadoEm=Date.now();r.erro='';delete r.auth;mud.push(r);enviados++;}
    else if(rej[r.id]){r.status='rejeitado';r.erro=rej[r.id];mud.push(r);recusados++;}}
   if(mud.length){await grava('fila',mud);mudou=true;}}
  await recarregarFila();
  /* 2) fotos (uma por vez; cada uma só sai da fila depois de confirmada) */
  const fts=(await todos('fotos')).filter(f=>!f.enviada&&!f.rascunho&&f.data);
  for(const f of fts){if(!online())break;
   const reg=S.fila.find(r=>r.id===f.regId);if(reg&&reg.status==='rejeitado')continue;
   await api({action:'foto',id:f.id,registroId:f.regId,tag:f.tag,momento:f.momento,data:f.data,thumb:f.thumb,criadoEm:f.criadoEm,auth:(reg&&reg.auth)||S.auth},120000);
   f.enviada=true;f.enviadaEm=Date.now();await grava('fotos',f);fotos++;}
  await recarregarFotosPend();
  /* 3) baixa cadastros e lançamentos novos (e avisa o servidor quanto ainda falta enviar deste aparelho) */
  if(S.user)mudou=await baixarDados()||mudou;else{await baixarCadastro();mudou=true;}
  S.lastSync=Date.now();await setMeta('lastSync',S.lastSync);S.lastErr='';
  await podar();
  if(manual)toast(recusados?`${recusados} item(ns) recusado(s) pelo servidor — veja em Fila de envio`:(enviados||fotos)?`${enviados} lançamento(s) e ${fotos} foto(s) enviados e confirmados`:'Tudo sincronizado',recusados?'erro':'ok');
 }catch(e){S.lastErr=e.message;if(manual||/Chave de acesso|não autorizado/i.test(e.message))toast('Não sincronizou: '+e.message+' — nada foi perdido.','erro');}
 finally{S.syncing=false;renderStatus();if(mudou){invalidar();redesenharSePuder();}verificarAlertas();}}

async function baixarDados(){
 const desde=S.lastPull?S.lastPull-180000:0;
 const d=await api({action:'dados',auth:S.auth,desde,dias:isAdm()?400:60,
  hb:{deviceId:S.deviceId,matricula:S.user.matricula,nome:S.user.nome,pendentes:S.fila.filter(r=>r.status==='pendente').length,fotosPendentes:S.fotosPend,versao:APP_VERSION,ua:navigator.userAgent.slice(0,140)}},120000);
 let mudou=false;
 const cad=assin([d.equipe,d.frentes,d.banheiros,d.config]);
 if(cad!==S._assinCad){S._assinCad=cad;mudou=true;S.equipeSrv=d.equipe||[];S.frentesSrv=d.frentes||[];S.banheirosSrv=d.banheiros||[];S.configSrv=d.config||{};
  await setMeta('equipe',S.equipeSrv);await setMeta('frentes',S.frentesSrv);await setMeta('banheiros',S.banheirosSrv);await setMeta('config',S.configSrv);}
 if(d.aparelhos&&d.aparelhos.length){S.aparelhos=d.aparelhos;setMeta('aparelhos',S.aparelhos);}
 let novasF=0;(d.fotos||[]).forEach(f=>{const l=S.fotosIdx[f.registroId]=S.fotosIdx[f.registroId]||[];if(!l.some(x=>x.id===f.id)){l.push({id:f.id,momento:f.momento});novasF++;}});
 if(novasF){mudou=true;await setMeta('fotosIdx',S.fotosIdx);}
 /* só o que é realmente novo ou alterado entra na memória e no aparelho */
 const idxR=S._idxR||(S._idxR=new Map(S.srvRegs.map((x,i)=>[x.id,i]))),idxS=S._idxS||(S._idxS=new Map(S.srvSins.map((x,i)=>[x.id,i])));
 const novos=[];
 (d.registros||[]).forEach(x=>{const i=idxR.get(x.id);if(i!=null&&S.srvRegs[i].alteradoEm===x.alteradoEm&&S.srvRegs[i].status===x.status)return;const o={...x,_k:'R'};novos.push(o);if(i!=null)S.srvRegs[i]=o;else{idxR.set(x.id,S.srvRegs.length);S.srvRegs.push(o);}});
 (d.sinalizacoes||[]).forEach(x=>{const i=idxS.get(x.id);if(i!=null&&S.srvSins[i].alteradoEm===x.alteradoEm)return;const o={...x,_k:'S'};novos.push(o);if(i!=null)S.srvSins[i]=o;else{idxS.set(x.id,S.srvSins.length);S.srvSins.push(o);}});
 if(novos.length){mudou=true;S.srvRegs=S.srvRegs.slice();await grava('srv',novos);}
 S.lastPull=d.agora||Date.now();await setMeta('lastPull',S.lastPull);
 if(S.user&&S.user.matricula!=='admin'){const u=S.equipeSrv.find(p=>String(p.matricula)===String(S.user.matricula));
  if(!u||u.ativo===false){toast('Seu acesso foi desativado pelo administrador.','erro');await sair(true);return;}
  if(u.hash&&S.auth&&S.auth.hash&&u.hash!==S.auth.hash&&!S.fila.some(r=>r.tipo==='SENHA'&&r.status!=='sincronizado')){toast('Sua senha foi redefinida pelo administrador. Entre de novo.','erro');await sair(true);return;}
  const perfil=u.perfil||'LANÇADOR';if(perfil!==S.user.perfil||u.nome!==S.user.nome){S.user={...S.user,nome:u.nome,funcao:u.funcao,turno:u.turno,perfil};await setMeta('user',S.user);mudou=true;}}
 return mudou;}
/* Limpeza: tira da fila o que já foi confirmado há mais de 30 dias e o arquivo grande das fotos enviadas há mais de 15 dias */
async function podar(){const lim=Date.now()-30*864e5,limF=Date.now()-15*864e5;
 const velhos=S.fila.filter(r=>r.status==='sincronizado'&&r.sincronizadoEm&&r.sincronizadoEm<lim).map(r=>r.id);if(velhos.length)await apaga('fila',velhos);
 const fts=(await todos('fotos')).filter(f=>f.enviada&&f.data&&f.enviadaEm<limF);if(fts.length)await grava('fotos',fts.map(f=>({...f,data:null})));
 await recarregarFila();}
function redesenharSePuder(){const a=document.activeElement;if(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&root.contains(a))return;if(document.querySelector('.modal'))return;if(S.user&&S.user.trocar)return;if(!S.user){if(!$('#lgMat')||!$('#lgMat').value)render();return;}if(S.tela==='form')return;render();}

function lerImagem(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),img=new Image();img.onload=()=>{URL.revokeObjectURL(u);res(img);};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('Imagem inválida'));};img.src=u;});}
const blobURL=b=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});
const paraJPG=(c,q)=>new Promise(r=>c.toBlob?c.toBlob(b=>r(b?blobURL(b):c.toDataURL('image/jpeg',q)),'image/jpeg',q):r(c.toDataURL('image/jpeg',q)));
async function processarFoto(file,momento){
 const f=S.form;const b=banPorId(f.banheiroId);
 /* decodifica fora da tela principal quando o celular permite */
 let src;try{src=await createImageBitmap(file,{imageOrientation:'from-image'});}catch(e){src=await lerImagem(file);}
 const w0=src.width||src.naturalWidth,h0=src.height||src.naturalHeight,k=Math.min(1,1600/Math.max(w0,h0)),w=Math.round(w0*k),hh=Math.round(h0*k);
 const c=document.createElement('canvas');c.width=w;c.height=hh;const x=c.getContext('2d');x.drawImage(src,0,0,w,hh);if(src.close)src.close();
 const txt=`${b?b.tag:''} · ${f.tipo||''} · ${momento.toUpperCase()}\n${fData(hoje())} ${agora()} · ${S.user.nome.split(' ').slice(0,2).join(' ')}`;
 const fs=Math.max(14,Math.round(w/42)),lines=txt.split('\n'),lh=fs*1.3,bh=lh*lines.length+fs*.6;x.font=`bold ${fs}px Arial`;
 x.fillStyle='rgba(0,30,90,.72)';x.fillRect(0,hh-bh,w,bh);x.fillStyle='#fff';lines.forEach((l,i)=>x.fillText(l,fs*.6,hh-bh+fs*.3+lh*(i+.8)));
 const data=await paraJPG(c,.72);
 const kt=320/Math.max(w,hh),t=document.createElement('canvas');t.width=Math.round(w*kt);t.height=Math.round(hh*kt);t.getContext('2d').drawImage(c,0,0,t.width,t.height);
 const thumb=await paraJPG(t,.6);c.width=c.height=0;
 const foto={id:uuid(),regId:f.id,tag:b?b.tag:'',momento,data,thumb,criadoEm:Date.now(),enviada:false,rascunho:true};
 await grava('fotos',foto);return foto;}

/* ------------------------------ Registrar (início) ------------------------------ */
function vLancar(){
 const pend=S.fila.filter(r=>r.status==='pendente').length+S.fotosPend,rej=S.fila.filter(r=>r.status==='rejeitado').length;
 const meusHoje=regsAtivos().filter(r=>r.data===hoje()&&(r.matriculaLanc===S.user.matricula||r.matriculaResp===S.user.matricula));
 const velho=pend&&(!S.lastSync||Date.now()-S.lastSync>12*3600e3);
 const d=new Date(),dt0=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'}),dt=dt0.charAt(0).toUpperCase()+dt0.slice(1);
 const st=statusTodos(),nL=[...st.values()].filter(s=>s.k==='limp').length,nR=[...st.values()].filter(s=>s.k==='rep'||s.k==='man').length;
 return `<div class="hero"><div class="hero-wm"><img src="${ASSET.simbB}" alt=""></div><div class="hero-in"><div class="hero-d">${dt} · Turno ${turnoDe()}</div><h1>${saudacao()}, ${h(primeiro(S.user.nome))}!</h1><div class="hero-s">${h(S.user.funcao||'')} · Matr. ${h(S.user.matricula)}</div>
  <div class="hero-st"><span class="hs ${pend?'w':''}">${ic(pend?'clock':'check')} ${pend?`${pend} aguardando envio`:'Tudo enviado'}</span><span class="hs">${ic('broom')} ${meusHoje.length} hoje</span><button class="hs bt" data-act="sync" ${S.syncing?'disabled':''}>${ic('sync')} Sincronizar</button></div></div></div>
 ${velho?`<div class="aviso">${ic('alert')}<div>Há itens guardados neste aparelho há mais de 12 h. Procure sinal de internet e toque em <b>Sincronizar</b>.</div></div>`:''}
 ${rej?`<div class="aviso">${ic('alert')}<div class="f1">${rej} item(ns) recusado(s) pelo servidor. <button class="btn sm" data-act="nav" data-to="fila" style="margin-left:6px">Ver</button></div></div>`:''}
 ${S.persist===false&&!window.DEMO_API?`<div class="aviso">${ic('alert')}<div>Instale o app na tela inicial e não limpe os dados do navegador, para garantir que nada se perca.</div></div>`:''}
 ${S.rascunhos.length?`<h2 class="sech">Em andamento</h2>${S.rascunhos.map(r=>{const b=banPorId(r.banheiroId);return `<div class="andam" data-act="continuar" data-id="${r.id}"><span class="item"><span class="di" style="--c:${r.tipo==='Reparo'?'var(--rep)':'var(--limp)'};margin:0">${ic(r.tipo==='Reparo'?'wrench':'broom')}</span></span><div class="f1"><b>${h(r.tipo||'Atividade')} · ${h(b?b.tag:'banheiro não escolhido')}</b><div class="tiny">${r.inicio?`Iniciada às ${h(r.inicio)}`:'Não iniciada'} · ${r.fotos.length} foto(s)</div></div>${r.inicio&&!r.fim?`<span class="crono" data-crono="${msDe(r.data,r.inicio)}">${fDur((Date.now()-msDe(r.data,r.inicio))/60000)}</span>`:''}${ic('right')}</div>`;}).join('')}`:''}
 ${cardAlerta()}
 <h2 class="sech">O que você vai registrar?</h2>
 <div class="acts2"><button class="bigact l" data-act="novo" data-tipo="Limpeza"><span class="bi">${ic('broom')}</span><span><b>Limpeza</b><small>${nL} banheiro(s) aguardando</small></span></button>
 <button class="bigact r" data-act="novo" data-tipo="Reparo"><span class="bi">${ic('wrench')}</span><span><b>Reparo</b><small>${nR} com necessidade</small></span></button></div>
 <button class="qrbtn" data-act="qr-novo">${ic('qr')}<span class="f1" style="text-align:left">Ler o QR Code da TAG<div class="tiny" style="font-weight:400">Abre o banheiro direto pela etiqueta</div></span>${ic('right')}</button>
 ${meusHoje.length?`<h2 class="sech">Seus registros de hoje</h2>${meusHoje.slice(0,8).map(itemReg).join('')}`:''}
 ${pend?`<button class="btn sec bl" data-act="exportar" style="margin-top:10px">${ic('download')} Gerar backup dos pendentes</button>`:''}`;}
function itemReg(r){const L=r.tipo==='Limpeza';return `<div class="item" data-act="ver-reg" data-id="${r.id}"><span class="di" style="--c:${L?'var(--limp)':'var(--rep)'}">${ic(L?'broom':'wrench')}</span><div class="f1" style="min-width:0"><div class="t">${h(r.tag)} <span class="st ${L?'limpeza':'reparo'}">${h(r.tipo)}</span> ${r.status==='EXCLUÍDO'?'<span class="st excl">Excluído</span>':''}</div><div class="s">${fData(r.data)} · ${h(r.inicio)}–${h(r.fim)} (${fDur(r.duracaoMin)}) · ${h(r.turno)} · ${h(r.frente)}</div><div class="s">${h(r.responsavel)}</div></div>${r.st!=='sincronizado'?`<span class="st ${r.st==='rejeitado'?'rejeitado':'pendente'}">${r.st==='rejeitado'?'Recusado':'Na fila'}</span>`:`<span class="st sincronizado">${ic('check')}</span>`}</div>`;}

 const b=banheiroId&&banPorId(banheiroId);
 const f={id:uuid(),tipo:tipo||'',banheiroId:b?b.id:'',frente:b?b.frente:'',data:hoje(),turno:turnoDe(),inicio:'',fim:'',
  responsavel:S.user.matricula==='admin'?'':S.user.nome,matriculaResp:S.user.matricula==='admin'?'':S.user.matricula,itens:[],situacao:tipo==='Reparo'?'Concluído':'',necessitaReparo:false,descReparo:'',observacoes:'',fotos:[],criado:Date.now()};
 S.form=f;S.erros=[];S.busca='';salvarRascunho(true);ir('form');}
async function salvarRascunho(agoraJa){const f=S.form;if(!f)return;const i=S.rascunhos.findIndex(r=>r.id===f.id);if(i>=0)S.rascunhos[i]=f;else S.rascunhos.push(f);
 clearTimeout(S._tR);const go=()=>setMeta('rascunhos',S.rascunhos.map(r=>({...r,fotos:r.fotos.map(x=>({id:x.id,momento:x.momento}))})));if(agoraJa)await go();else S._tR=setTimeout(go,300);}
async function carregarThumbsForm(){const f=S.form;for(const x of f.fotos)if(!x.thumb){const ft=await pega('fotos',x.id);if(ft)x.thumb=ft.thumb;}}
const SC='spellcheck="true" lang="pt-BR" autocapitalize="sentences" autocorrect="on"';

 const f=S.form;if(!f){S.tela='lancar';return vLancar();}
 const E=new Set(S.erros||[]),er=k=>E.has(k)?'err-campo':'';
 const b=f.banheiroId&&banPorId(f.banheiroId),st=b&&stDe(b);
 const dur=duracao(f.inicio,f.fim),L=f.tipo==='Limpeza',R=f.tipo==='Reparo';
 const eq=equipe().filter(p=>p.ativo!==false);
 const fr=frentesAtivas().map(x=>x.nome);if(f.frente&&!fr.includes(f.frente))fr.unshift(f.frente);
 const fotos=m=>`<div class="fotos">${f.fotos.filter(x=>x.momento===m).map(x=>`<div class="ft" data-act="ver-foto-local" data-id="${x.id}"><img src="${x.thumb||''}" alt=""><button class="x" data-act="rm-foto" data-id="${x.id}" aria-label="Remover">${ic('x')}</button></div>`).join('')}

 return `<div class="fhead" style="--c:${R?'var(--rep)':'var(--limp)'}"><span class="di">${ic(R?'wrench':'broom')}</span><div class="f1"><h1 style="margin:0">${f.tipo?`Registro de ${f.tipo.toLowerCase()}`:'Novo registro'}</h1><div class="tiny">Salvo automaticamente neste aparelho enquanto você preenche</div></div></div>
 ${S.erros&&S.erros.length?`<div class="aviso">${ic('alert')}<div>Preencha os campos destacados em vermelho para finalizar o registro.</div></div>`:''}
 <div class="sec"><div class="sec-t">Banheiro químico</div><div class="sec-b">
  ${b?`<div class="bansel"><span class="bi">${ic('toilet')}</span><div class="f1"><div class="tagb">${h(b.tag)}</div><div class="tiny">${[b.descricao,b.frente,b.localizacao].filter(Boolean).map(h).join(' · ')}</div><div style="margin-top:4px">${stBadge(st.k)} <span class="tiny">Última limpeza: ${st.ultLimp?fDT(st.ultLimp):'nenhuma'}</span></div></div><button class="btn sec sm" data-act="trocar-ban">Trocar</button></div>`
  :`<div class="campo ${er('banheiroId')}"><label>Selecione pela TAG <span class="req">*</span></label><div class="row"><div class="inp-ic f1">${ic('search')}<input id="buscaBan" placeholder="Digite a TAG…" autocomplete="off" value="${h(S.busca||'')}"></div><button class="btn sec" data-act="qr-form" title="Ler QR Code">${ic('qr')}</button></div><div id="banRes">${banResHTML()}</div></div>`}
 </div></div>
 <div class="sec"><div class="sec-t">Atividade</div><div class="sec-b">
  <div class="campo ${er('tipo')}"><label>Tipo de atividade <span class="req">*</span></label><div class="tipo-sel"><label><input type="radio" name="tipo" value="Limpeza" data-k="tipo" ${L?'checked':''}><span class="l">${ic('broom')} Limpeza</span></label><label><input type="radio" name="tipo" value="Reparo" data-k="tipo" ${R?'checked':''}><span class="r">${ic('wrench')} Reparo</span></label></div></div>
  <div class="grid2 r"><div class="campo ${er('data')}"><label>Data <span class="req">*</span></label><input type="date" data-k="data" value="${h(f.data)}" max="${hoje()}"></div>
  <div class="campo ${er('turno')}"><label>Turno <span class="req">*</span></label><div class="tipo-sel turno-sel">${TURNOS.map(t=>`<label><input type="radio" name="turno" value="${t}" data-k="turno" ${f.turno===t?'checked':''}><span>${ic(t==='Diurno'?'sun':'moon')} ${t}</span></label>`).join('')}</div></div></div>
  <div class="campo ${er('frente')}"><label>Frente de serviço <span class="req">*</span></label><select data-k="frente"><option value="">Selecione…</option>${fr.map(n=>`<option ${f.frente===n?'selected':''}>${h(n)}</option>`).join('')}</select></div>
 </div></div>
 <div class="sec"><div class="sec-t">Horário</div><div class="sec-b">
  <div class="grid2 r"><div class="campo ${er('inicio')}"><label>Início <span class="req">*</span></label><div class="hora"><input type="time" data-k="inicio" value="${h(f.inicio)}"><button class="btn ${f.inicio?'sec':'vd'}" data-act="hora" data-k="inicio">${ic('play')} Agora</button></div></div>
  <div class="campo ${er('fim')}"><label>Término <span class="req">*</span></label><div class="hora"><input type="time" data-k="fim" value="${h(f.fim)}"><button class="btn ${f.inicio&&!f.fim?'':'sec'}" data-act="hora" data-k="fim">${ic('stop')} Agora</button></div></div></div>
  <div class="dur ${dur!=null&&(dur===0||dur>720)?'err':''}" id="durBox"><span class="muted">${ic('timer')} Duração total (calculada)</span><b id="durVal">${dur==null?(f.inicio?`<span data-crono="${msDe(f.data,f.inicio)}">${fDur((Date.now()-msDe(f.data,f.inicio))/60000)}</span>`:'—'):fDur(dur)}</b></div>
  ${dur===0?`<div class="tiny" style="color:var(--err);margin-top:6px">O término precisa ser depois do início.</div>`:''}${dur!=null&&dur>720?`<div class="tiny" style="color:var(--err);margin-top:6px">${minDe(f.fim)<minDe(f.inicio)?'O término está antes do início. Confira os horários (só passa da meia-noite em atividades noturnas de até 12 h).':'Duração acima de 12 h — confira os horários.'}</div>`:''}
 </div></div>
 <div class="sec"><div class="sec-t">Execução</div><div class="sec-b">
  <div class="campo ${er('responsavel')}"><label>Responsável pela execução <span class="req">*</span></label><select data-k="matriculaResp"><option value="">Selecione…</option>${eq.map(p=>`<option value="${h(p.matricula)}" ${String(f.matriculaResp)===String(p.matricula)?'selected':''}>${h(p.nome)} – ${h(p.matricula)}</option>`).join('')}</select></div>
  ${R?`<div class="campo"><label>Situação do reparo <span class="req">*</span></label><div class="chips">${['Concluído','Em andamento'].map(t=>`<label class="chip"><input type="radio" name="sit" value="${t}" data-k="situacao" ${f.situacao===t?'checked':''}><span>${t==='Concluído'?ic('check'):ic('clock')} ${t==='Em andamento'?'Em andamento (banheiro em manutenção)':t}</span></label>`).join('')}</div></div>
   <div class="campo"><label>Descrição do reparo</label><textarea data-k="descReparo" ${SC} placeholder="O que foi reparado / o que falta">${h(f.descReparo)}</textarea></div>`:''}
  ${L?`<div class="campo"><div class="sw"><span><b>Identificou necessidade de reparo?</b><div class="tiny">O banheiro passa para "Necessita de reparo"</div></span><input type="checkbox" data-k="necessitaReparo" ${f.necessitaReparo?'checked':''}></div>
   ${f.necessitaReparo?`<textarea data-k="descReparo" ${SC} placeholder="Descreva o problema encontrado" style="margin-top:8px">${h(f.descReparo)}</textarea>`:''}</div>`:''}
  <div class="campo ${er('observacoes')}"><label>Observações sobre o serviço <span class="tiny" style="font-weight:400">(opcional)</span></label><textarea data-k="observacoes" ${SC} placeholder="Descreva como ficou o banheiro">${h(f.observacoes)}</textarea>
   ${f.tipo?`<div class="frases">${FRASES[f.tipo].map(t=>`<button data-act="frase" data-t="${h(t)}">+ ${h(t)}</button>`).join('')}</div>`:''}</div>
 </div></div>
 <div class="sec"><div class="sec-t">Fotos <span class="tiny" style="text-transform:none;letter-spacing:0;font-weight:500;color:var(--tx3)">— ao menos 1 foto (antes e/ou depois)</span></div><div class="sec-b ${er('fotos')}">
  <label class="lbl">Antes da execução</label>${fotos('Antes')}<label class="lbl" style="margin-top:14px">Depois da execução</label>${fotos('Depois')}
  ${E.has('fotos')?`<div class="tiny" style="color:var(--err);margin-top:8px">Anexe pelo menos uma foto.</div>`:''}
 </div></div>
 <div class="barra-acoes"><button class="btn sec" data-act="descartar-form" title="Descartar">${ic('trash')}</button><button class="btn sec" data-act="guardar-form">${ic('clock')} <span>Depois</span></button><button class="btn vd" data-act="salvar-form">${ic('check')} Finalizar</button></div>`;}
function banResHTML(){const q=normTag(S.busca||''),L=banheiros().filter(b=>b.ativo&&(!q||b.tag.includes(q)||normTag(b.descricao).includes(q)||normTag(b.frente).includes(q)));
 if(!banheiros().length)return `<div class="info" style="margin-top:8px">Nenhum banheiro cadastrado neste aparelho. ${isAdm()?'Cadastre em <b>Cadastro de banheiros</b>.':'Sincronize com internet ou peça ao administrador.'}</div>`;
 const st=statusTodos();return `<div class="ban-res">${L.slice(0,40).map(b=>{const s=st.get(b.id)||{k:'ok'};return `<button data-act="esc-ban" data-id="${b.id}"><span class="f1"><span class="tagb">${h(b.tag)}</span><div class="tiny">${h(b.frente||'')} · ${h(b.localizacao||b.descricao||'')}</div></span>${stBadge(s.k)}</button>`;}).join('')||'<div class="muted" style="padding:12px">Nenhuma TAG encontrada</div>'}</div>${L.length>40?`<div class="tiny" style="margin-top:4px">Mostrando 40 de ${L.length}. Digite mais da TAG.</div>`:''}`;}
function posForm(){carregarThumbsForm().then(()=>{document.querySelectorAll('.fotos .ft').forEach(el=>{const x=S.form&&S.form.fotos.find(y=>y.id===el.dataset.id);const im=el.querySelector('img');if(x&&im&&!im.getAttribute('src'))im.src=x.thumb||'';});});}
function onCampoForm(e){const t=e.target,f=S.form;if(!f||S.tela!=='form')return;
 if(t.id==='buscaBan'){if(e.type!=='input')return;S.busca=t.value;$('#banRes').innerHTML=banResHTML();return;}
 if(t.dataset.item){const i=f.itens.indexOf(t.dataset.item);if(t.checked&&i<0)f.itens.push(t.dataset.item);if(!t.checked&&i>=0)f.itens.splice(i,1);salvarRascunho();return;}
 const k=t.dataset.k;if(!k)return;
 if(k==='matriculaResp'){const p=equipe().find(x=>String(x.matricula)===t.value);f.matriculaResp=t.value;f.responsavel=p?p.nome:'';}
 else if(t.type==='checkbox')f[k]=t.checked;else f[k]=t.value;
 if(k==='inicio'&&e.type==='change'&&f.inicio&&!f._turnoManual)f.turno=turnoDe(f.inicio);
 if(k==='turno')f._turnoManual=true;
 salvarRascunho();
 if(['tipo','necessitaReparo'].includes(k)&&e.type==='change'){if(k==='tipo'){f.itens=[];f.situacao=f.tipo==='Reparo'?(f.situacao||'Concluído'):'';}render();return;}
 if(['inicio','fim','data'].includes(k)&&e.type==='change'){render();return;}
 if(S.erros&&S.erros.length&&e.type==='change'){S.erros=validar(f);}}
function validar(f){const e=[];if(!f.banheiroId)e.push('banheiroId');['tipo','data','turno','frente','inicio','fim'].forEach(k=>{if(!String(f[k]||'').trim())e.push(k);});
 if(!f.matriculaResp||!f.responsavel)e.push('responsavel');if(!f.fotos.length)e.push('fotos');
 const d=duracao(f.inicio,f.fim);if(f.inicio&&f.fim&&(!d||d>720))e.push('fim');if(f.data>hoje())e.push('data');
 if(f.tipo==='Reparo'&&!f.situacao)e.push('situacao');return e;}
async function salvarForm(){
 const f=S.form;f.observacoes=corrigirTexto(f.observacoes);if(f.descReparo)f.descReparo=corrigirTexto(f.descReparo);
 S.erros=validar(f);
 if(S.erros.length){render();const el=document.querySelector('.err-campo');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});toast('Faltam campos obrigatórios','erro');return;}
 const b=banPorId(f.banheiroId),dur=duracao(f.inicio,f.fim);
 const dados={tipo:f.tipo,tag:b.tag,banheiroId:b.id,data:f.data,turno:f.turno,frente:f.frente,inicio:f.inicio,fim:f.fim,duracaoMin:dur,responsavel:f.responsavel,matriculaResp:f.matriculaResp,
  observacoes:f.observacoes,itens:f.itens,situacao:f.tipo==='Reparo'?f.situacao:'',necessitaReparo:f.tipo==='Limpeza'&&f.necessitaReparo,descReparo:(f.tipo==='Reparo'||f.necessitaReparo)?f.descReparo:'',
  fotos:f.fotos.map(x=>({id:x.id,momento:x.momento})),_id:f.id};
 const fts=await Promise.all(f.fotos.map(x=>pega('fotos',x.id)));await grava('fotos',fts.filter(Boolean).map(x=>({...x,rascunho:false,tag:b.tag,regId:f.id})));
 const rec=await enfileirar('REGISTRO',dados,f.tipo==='Reparo'?'REP':'LIM');
 S.rascunhos=S.rascunhos.filter(r=>r.id!==f.id);await setMeta('rascunhos',S.rascunhos.map(r=>({...r,fotos:r.fotos.map(x=>({id:x.id,momento:x.momento}))})));
 await recarregarFotosPend();S.form=null;S.erros=[];
 toast(`${f.tipo} ${rec.numero} registrada${online()?' — enviando…':' — guardada no aparelho'}`,'ok');ir('lancar');}
async function descartarForm(){const f=S.form;if(!await confirmar('Descartar este registro e as fotos dele?','Descartar'))return;
 await apaga('fotos',f.fotos.map(x=>x.id));S.rascunhos=S.rascunhos.filter(r=>r.id!==f.id);await setMeta('rascunhos',S.rascunhos.map(r=>({...r,fotos:r.fotos.map(x=>({id:x.id,momento:x.momento}))})));S.form=null;ir('lancar');}
function pedirFoto(momento,camera){const f=S.form;if(!f.banheiroId){toast('Escolha o banheiro antes das fotos (a TAG vai carimbada na foto)','erro');return;}
 const inp=document.createElement('input');inp.type='file';inp.accept='image/*';if(camera)inp.capture='environment';else inp.multiple=true;
 inp.onchange=async()=>{const files=[...inp.files];if(!files.length)return;toast(`Processando ${files.length} foto(s)…`);
  for(const file of files){try{const ft=await processarFoto(file,momento);f.fotos.push({id:ft.id,momento,thumb:ft.thumb});}catch(e){toast('Falha na foto: '+e.message,'erro');}}
  await salvarRascunho(true);if(S.erros&&S.erros.length)S.erros=validar(f);render();};
 inp.click();}

/* ------------------------------ Fila de envio ------------------------------ */
const NOMES_FILA={APAGAR:'Apagar registros',SENHA:'Troca de senha',BANHEIRO_DEL:'Exclusão de banheiro',REGISTRO:'Registro',SINALIZACAO:'Sinalização',BANHEIRO:'Cadastro de banheiro',FRENTE:'Frente de serviço',EQUIPE:'Equipe',EXCLUSAO:'Exclusão de registro',CONFIG:'Configuração'};
function vFila(){

  <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end"><span class="st ${r.status}">${{pendente:'Na fila',sincronizado:'Confirmado',rejeitado:'Recusado'}[r.status]}</span>${r.status==='rejeitado'?`<button class="btn sm" data-act="reenviar" data-id="${r.id}">Reenviar</button><button class="btn sm perigo" data-act="rm-fila" data-id="${r.id}">Remover</button>`:''}</div></div>`;}).join(''):`<div class="card vazio">${ic('check')}<div>Nada na fila deste aparelho.</div></div>`}

async function exportar(){
 const regs=S.fila.filter(r=>r.status!=='sincronizado');const fts=(await todos('fotos')).filter(f=>!f.enviada&&!f.rascunho&&f.data);
 if(!regs.length&&!fts.length){toast('Não há itens pendentes para backup.');return;}
 const data={app:'fagundes-banheiros',versao:APP_VERSION,deviceId:S.deviceId,exportadoEm:new Date().toISOString(),usuario:S.user&&{matricula:S.user.matricula,nome:S.user.nome},fila:regs,fotos:fts};
 const d=new Date(),nome=`backup_banheiros_${S.user?S.user.matricula:'aparelho'}_${isoD(d)}_${pad(d.getHours())}${pad(d.getMinutes())}.json`;
 const blob=new Blob([JSON.stringify(data)],{type:'application/json'}),file=new File([blob],nome,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup Banheiros Químicos',text:`${regs.length} item(ns) e ${fts.length} foto(s) pendentes`});return;}}catch(e){if(e.name==='AbortError')return;}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();a.remove();toast(`Backup gerado: ${regs.length} item(ns), ${fts.length} foto(s)`,'ok');}
async function importar(file){
 try{const j=JSON.parse(await file.text());if(j.app!=='fagundes-banheiros'||!Array.isArray(j.fila))throw new Error('Arquivo não é um backup deste app');
  const ex=new Set(S.fila.map(r=>r.id));let n=0;const novos=[];
  for(const r of j.fila){if(!r.id||ex.has(r.id))continue;r.status='pendente';r.erro='';r.importado=true;novos.push(r);n++;}
  if(novos.length)await grava('fila',novos);
  const fx=new Set((await todos('fotos')).map(f=>f.id)),nf=(j.fotos||[]).filter(f=>!fx.has(f.id)).map(f=>({...f,enviada:false,rascunho:false}));if(nf.length)await grava('fotos',nf);
  await recarregarFila();await recarregarFotosPend();invalidar();toast(`${n} item(ns) e ${nf.length} foto(s) importados. Enviando…`,'ok');sincronizar(true);render();
 }catch(e){toast('Falha ao importar: '+e.message,'erro');}}

/* miniaturas: aparelho → cache → servidor */
async function preencherThumbs(){const els=[...document.querySelectorAll('img[data-thumb]')].filter(e=>!e.getAttribute('src'));if(!els.length)return;
 const ids=[...new Set(els.map(e=>e.dataset.thumb))],achou={},falta=[];
 for(const id of ids){const f=await pega('fotos',id);if(f&&f.thumb){achou[id]=f.thumb;continue;}const c=await pega('cache',id);if(c&&c.thumb){achou[id]=c.thumb;continue;}falta.push(id);}
 if(falta.length&&online()&&temServidor()&&S.auth){try{for(let i=0;i<falta.length;i+=60){const r=await api({action:'thumbs',ids:falta.slice(i,i+60),auth:S.auth});const novos=Object.entries(r.thumbs||{}).filter(([,t])=>t).map(([id,t])=>({id,thumb:t}));if(novos.length)await grava('cache',novos);novos.forEach(x=>achou[x.id]=x.thumb);}}catch(e){}}
 els.forEach(e=>{const t=achou[e.dataset.thumb];if(t)e.src=t;else e.closest('figure')&&(e.closest('figure').innerHTML=`<div class="sem">${online()?'Foto indisponível':'Sem internet'}</div>`);});}
async function verFoto(id){const v=document.createElement('div');v.className='visor';v.innerHTML=`<button>${ic('x')}</button><div class="muted" style="color:#fff">Carregando…</div>`;v.onclick=()=>v.remove();document.body.appendChild(v);
 let src=null;const f=await pega('fotos',id);if(f&&f.data)src=f.data;else{const c=await pega('cache',id);if(c&&c.full)src=c.full;}
 if(!src&&online()&&temServidor()){try{const r=await api({action:'fotoFull',id,auth:S.auth},60000);src=r.data;const c=await pega('cache',id)||{id};c.full=src;await grava('cache',c);}catch(e){}}
 if(!src){const c=(f&&f.thumb)||((await pega('cache',id))||{}).thumb;src=c;}
 v.innerHTML=`<button>${ic('x')}</button>`+(src?`<img src="${src}" alt="">`:`<div style="color:#fff">Foto disponível apenas com internet.</div>`);}
async function excluirRegistro(id){const r=registros().find(x=>x.id===id);if(!r)return;
 const motivo=await perguntar(`Excluir ${r.tipo.toLowerCase()} ${r.numero||''}`,'Motivo da exclusão (fica registrado — o registro não é apagado da planilha)',true);if(!motivo)return;
 await enfileirar('EXCLUSAO',{ref:r.id,numero:r.numero,tag:r.tag,motivo},'EXC');toast('Exclusão registrada','ok');render();}

/* Apagar definitivamente: só registros já EXCLUÍDOS. Somem do app, dos relatórios e do painel; as fotos vão para a lixeira do Drive.
   Na planilha a linha fica marcada como APAGADO (rastro de auditoria). */
async function apagarRegistros(ids){
 const conf=new Set(S.srvRegs.filter(x=>x.status==='EXCLUÍDO').map(x=>x.id)),prontos=ids.filter(i=>conf.has(i)),esperando=ids.length-prontos.length;
 if(!prontos.length){toast(online()?'A exclusão ainda está sendo enviada. Toque em Sincronizar e tente de novo.':'Sem internet: a exclusão ainda não chegou ao servidor. Tente quando houver sinal.','erro');return;}
 if(esperando)toast(`${esperando} exclusão(ões) ainda não chegaram ao servidor e ficam para depois.`);
 ids=prontos;
 if(!await confirmar(`Apagar definitivamente ${ids.length} registro(s) excluído(s)? Eles somem do app e dos relatórios, e as fotos vão para a lixeira do Drive. Não dá para desfazer.`,'Apagar'))return;
 for(let i=0;i<ids.length;i+=200)await enfileirar('APAGAR',{ids:ids.slice(i,i+200)},'APG');

/* ------------------------------ Alerta de limpeza vencida ------------------------------
   Calculado no próprio aparelho (funciona sem internet): frequência do banheiro (padrão 24 h)
   contada a partir da última limpeza registrada, ou da data de disponibilização. */
function listaVencidos(){const st=statusTodos();return banheiros().filter(b=>b.ativo).map(b=>({b,s:st.get(b.id)})).filter(x=>x.s&&x.s.k==='limp')
 .sort((x,y)=>(y.s.atrasoH==null?1e9:y.s.atrasoH)-(x.s.atrasoH==null?1e9:x.s.atrasoH));}
function listaProximos(horas=2){const st=statusTodos(),ag=Date.now();return banheiros().filter(b=>b.ativo).map(b=>({b,s:st.get(b.id)})).filter(x=>x.s&&x.s.k==='ok'&&x.s.venceEm&&x.s.venceEm-ag<horas*3600e3).sort((x,y)=>x.s.venceEm-y.s.venceEm);}
function atrasoTxt(s){if(s.atrasoH!=null&&s.atrasoH>0){const h=s.atrasoH;return h<1?`venceu há ${Math.max(1,Math.round(h*60))} min`:h<48?`venceu há ${fN(h)} h`:`venceu há ${fN(h/24)} dias`;}
 if(/Sinalizado/.test(s.motivo||''))return 'sinalizado';return s.ultLimp?'vencida':'sem limpeza registrada';}
const localTxt=b=>[b.localizacao,b.descricao].filter(Boolean).join(' · ')||'Local não informado no cadastro';
function itemVencido(x,mini){const b=x.b,s=x.s,grave=s.atrasoH!=null&&s.atrasoH>=s.freq;
 return `<div class="venc ${grave?'grave':''}"><div class="vt"><span class="tagb">${h(b.tag)}</span><span class="vb">${h(atrasoTxt(s))}</span></div>
  <div class="vl">${ic('pin')}<div><b>${h(localTxt(b))}</b><small>${h(b.frente||'Sem frente definida')}</small></div></div>
  ${mini?'':`<div class="tiny">Última limpeza: ${s.ultLimp?fDT(s.ultLimp)+' ('+tempo(s.ultLimp)+')':'nenhuma registrada'} · frequência ${s.freq} h${/Sinalizado/.test(s.motivo||'')?' · '+h(s.motivo):''}</div>`}
  <div class="row" style="margin-top:8px"><button class="btn vd sm f1" data-act="novo" data-tipo="Limpeza" data-ban="${b.id}">${ic('broom')} Limpar agora</button>${mini?'':`<button class="btn sec sm" data-act="ver-ban" data-id="${b.id}">${ic('clock')} Histórico</button>`}</div></div>`;}
function cardAlerta(){const L=listaVencidos();if(!L.length)return '';
 return `<div class="alerta-limp"><div class="al-top">${ic('alert')}<div class="f1"><b>${L.length} banheiro(s) com limpeza vencida</b><small>Toque em “Limpar agora” para registrar</small></div><button class="btn sm" data-act="nav" data-to="vencidos">Ver todos</button></div>
 ${L.slice(0,3).map(x=>itemVencido(x,true)).join('')}${L.length>3?`<button class="btn ghost bl" data-act="nav" data-to="vencidos">+ ${L.length-3} banheiro(s) — ver lista completa ${ic('right')}</button>`:''}</div>`;}

 const L=T.filter(x=>!fr||(x.b.frente||'Sem frente definida')===fr),frs=[...new Set(T.map(x=>x.b.frente||'Sem frente definida'))].sort();
 const grupos={};L.forEach(x=>{const k=x.b.frente||'Sem frente definida';(grupos[k]=grupos[k]||[]).push(x);});
 const podeNotif='Notification' in window&&Notification.permission==='default';
 return `<h1>Limpezas vencidas</h1><p class="sub">Banheiros que passaram da frequência de limpeza${S.lastSync?'':' (calculado com os dados deste aparelho)'}. Funciona mesmo sem internet.</p>
 ${podeNotif?`<div class="info" style="display:flex;gap:10px;align-items:center;margin-bottom:12px">${ic('alert')}<div class="f1">Receba um aviso no celular quando um banheiro vencer.</div><button class="btn sm" data-act="ativar-alerta">Ativar aviso</button></div>`:''}
 <div class="kpis" style="margin-bottom:12px">${kpi('alert','Vencidos agora',fN(T.length),'precisam de limpeza','#c93434',T.length?'#c93434':'#1f8f3a')}${kpi('clock','Vencem em até 2 h',fN(P.length),'programe a próxima rota','#d99100')}</div>
 ${frs.length>1?`<div class="stchips"><button class="${!fr?'at':''}" data-act="vfr" data-k="">Todas <em>${T.length}</em></button>${frs.map(f=>`<button class="${fr===f?'at':''}" data-act="vfr" data-k="${h(f)}">${h(f)} <em>${T.filter(x=>(x.b.frente||'Sem frente definida')===f).length}</em></button>`).join('')}</div>`:''}
 ${L.length?Object.keys(grupos).sort().map(g=>`<h2 class="sech">${ic('map')} ${h(g)} <span class="tiny">(${grupos[g].length})</span></h2><div class="vgrid">${grupos[g].map(x=>itemVencido(x)).join('')}</div>`).join('')
  :`<div class="card vazio">${ic('check')}<div><b>Nenhuma limpeza vencida.</b></div><p class="muted">Todos os banheiros ativos estão dentro da frequência.</p></div>`}

async function verificarAlertas(){
 try{if(!S.user||!('Notification' in window)||Notification.permission!=='granted')return;
  const L=listaVencidos(),ids=L.map(x=>x.b.id);let ja=[];try{ja=JSON.parse(localStorage.getItem('fagbq_alertados')||'[]');}catch(e){}

  const tit=novos.length===1?`Limpeza vencida: ${novos[0].b.tag}`:`${novos.length} banheiros precisam de limpeza`;

  if(reg&&reg.showNotification)reg.showNotification(tit,{body:corpo,icon:'icon-192.png',badge:'icon-192.png',tag:'vencidos',renotify:true,data:{tela:'vencidos'}});
  else new Notification(tit,{body:corpo,icon:'icon-192.png',tag:'vencidos'});
 }catch(e){}}
async function ativarAlerta(){try{const p=await Notification.requestPermission();if(p==='granted'){localStorage.removeItem('fagbq_alertados');toast('Aviso ativado neste aparelho','ok');verificarAlertas();}else toast('Permissão negada. Ative as notificações do app nas configurações do celular.','erro');}catch(e){toast('Este aparelho não permite avisos.','erro');}render();}

async function lerQR(){
 if(!('BarcodeDetector' in window)){toast('Este celular não lê QR pelo app. Digite a TAG na busca.','erro');return null;}
 let stream;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});}catch(e){toast('Sem acesso à câmera: '+e.message,'erro');return null;}
 const det=new BarcodeDetector({formats:['qr_code']});
 return new Promise(res=>{let ok=false;const m=modal(`<h2>Aponte para o QR da TAG</h2><div class="qrv"><video playsinline autoplay muted></video></div><button class="btn sec bl" data-m="0" style="margin-top:12px">Cancelar</button>`,(v,mm)=>{fechar(null);});
  const v=$('video',m);v.srcObject=stream;
  const fechar=r=>{if(ok)return;ok=true;stream.getTracks().forEach(t=>t.stop());m.remove();res(r);};m._fechar=()=>fechar(null);
  const loop=async()=>{if(ok)return;try{const c=await det.detect(v);if(c.length){const t=normTag(String(c[0].rawValue).replace(/^BQ:/i,''));if(navigator.vibrate)navigator.vibrate(80);fechar(t);return;}}catch(e){}setTimeout(loop,250);};
  v.onloadedmetadata=()=>loop();});}
async function qrAbrir(destino){const t=await lerQR();if(!t)return;const b=banheiros().find(x=>x.tag===t);if(!b){toast(`TAG ${t} não cadastrada`,'erro');return;}
 if(destino==='form'&&S.form){S.form.banheiroId=b.id;S.form.frente=S.form.frente||b.frente;salvarRascunho();render();return;}
 ir('banheiro',{banId:b.id});}

/* ------------------------------ Implantação da base: modelo Excel + importação ------------------------------ */
const MODELOS={banheiros:{arq:'modelo_banheiros.xlsx',aba:'Banheiros',nome:'banheiros'},frentes:{arq:'modelo_frentes.xlsx',aba:'Frentes',nome:'frentes'},equipe:{arq:'modelo_equipe.xlsx',aba:'Equipe',nome:'pessoas'}};
function cardImportar(tipo,extra){const m=MODELOS[tipo];return `<div class="card impb"><h2>${ic('upload')} Implantação da base</h2>

 ${extra?`<details style="margin-top:12px"><summary class="tiny" style="cursor:pointer">Ou copie e cole direto do Excel</summary>${extra}</details>`:''}</div>`;}
const normCab=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/\*|\(.*?\)/g,'').replace(/\s+/g,' ').trim();
function dataPlan(v){if(v==null||v==='')return '';if(v instanceof Date&&!isNaN(v))return isoD(new Date(v.getTime()+v.getTimezoneOffset()*0));if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5));return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`;}return lerDataBR(v);}
async function lerPlanilha(file,aba){await carregarScript('lib/xlsx.min.js');const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
 const ws=wb.Sheets[aba]||wb.Sheets[wb.SheetNames.find(n=>!/instru/i.test(n))||wb.SheetNames[0]];
 const linhas=XLSX.utils.sheet_to_json(ws,{defval:'',raw:true});
 return linhas.map((l,i)=>{const o={_lin:i+2};Object.keys(l).forEach(k=>o[normCab(k)]=typeof l[k]==='string'?l[k].trim():l[k]);return o;}).filter(o=>Object.keys(o).some(k=>k!=='_lin'&&String(o[k]).trim()!==''));}

async function planoBanheiros(L){
 const ex=new Map(banheiros().map(b=>[b.tag,b])),frs=new Map(frentes().map(f=>[f.nome,f])),vistos=new Set(),erros=[],itens=[],novasF=new Set();let novos=0,atual=0;
 for(const o of L){const tag=normTag(o['tag']),fr=String(o['frente de servico']||'').trim().toUpperCase().replace(/\s+/g,' ');
  if(!tag){erros.push({l:o._lin,m:'TAG em branco'});continue;}if(vistos.has(tag)){erros.push({l:o._lin,m:`TAG ${tag} repetida na planilha`});continue;}
  const dt=dataPlan(o['data de disponibilizacao']);if(o['data de disponibilizacao']&&!dt){erros.push({l:o._lin,m:`${tag}: data inválida (use dd/mm/aaaa)`});continue;}
  const fq=String(o['frequencia de limpeza']||'').replace(',','.');if(fq&&!(+fq>0)){erros.push({l:o._lin,m:`${tag}: frequência inválida`});continue;}
  vistos.add(tag);if(fr&&!frs.has(fr))novasF.add(fr);const b=ex.get(tag);b?atual++:novos++;
  itens.push({id:b?b.id:uuid(),tag,descricao:String(o['descricao']||(b&&b.descricao)||''),frente:fr||(b&&b.frente)||'',localizacao:String(o['localizacao']||(b&&b.localizacao)||''),dataDisponibilizacao:dt||(b&&b.dataDisponibilizacao)||hoje(),
   frequenciaH:fq?+fq:'',ativo:!/^inativ/i.test(String(o['status']||'')),observacoes:String(o['observacoes']||''),criadoEm:b?b.criadoEm:Date.now(),atualizadoEm:Date.now()});}
 return {novos,atual,erros,itens,extra:novasF.size?['Frentes novas',novasF.size]:null,aplicar:async()=>{
  for(const fr of novasF)await enfileirar('FRENTE',{id:uuid(),nome:fr,descricao:'',localizacao:'',ativa:true,atualizadoEm:Date.now()},'FRE');
  for(const d of itens)await enfileirar('BANHEIRO',d,'BAN');}};}
async function planoFrentes(L){
 const ex=new Map(frentes().map(f=>[f.nome,f])),vistos=new Set(),erros=[],itens=[];let novos=0,atual=0;
 for(const o of L){const nome=String(o['frente de servico']||o['nome']||'').trim().toUpperCase().replace(/\s+/g,' ');
  if(!nome){erros.push({l:o._lin,m:'Nome da frente em branco'});continue;}if(vistos.has(nome)){erros.push({l:o._lin,m:`${nome} repetida na planilha`});continue;}
  vistos.add(nome);const f=ex.get(nome);f?atual++:novos++;

 return {novos,atual,erros,itens,aplicar:async()=>{for(const d of itens)await enfileirar('FRENTE',d,'FRE');}};}
async function planoEquipe(L){
 const ex=new Map(equipe().map(p=>[String(p.matricula),p])),erros=[],itens=[],vistos=new Set(),nomes=new Map();let novos=0,atual=0;
 equipe().forEach(p=>nomes.set(normNome(p.nome),String(p.matricula)));
 for(const o of L){const mat=String(o['matricula']||'').trim(),nome=String(o['nome completo']||o['nome']||'').trim().toUpperCase().replace(/\s+/g,' ');
  if(!mat||!nome){erros.push({l:o._lin,m:'Matrícula e nome completo são obrigatórios'});continue;}
  if(vistos.has(mat)){erros.push({l:o._lin,m:`Matrícula ${mat} repetida na planilha`});continue;}
  const dono=nomes.get(normNome(nome));if(dono&&dono!==mat){erros.push({l:o._lin,m:`${nome}: já existe outra pessoa com esse nome (o login é pelo nome)`});continue;}
  const senha=String(o['senha inicial']??'').trim();if(senha&&senha.length<4){erros.push({l:o._lin,m:`${nome}: senha com menos de 4 caracteres`});continue;}
  vistos.add(mat);nomes.set(normNome(nome),mat);const p=ex.get(mat);p?atual++:novos++;
  const tur=TURNOS_EQ.find(t=>normNome(t)===normNome(o['turno']))||(p&&p.turno)||'Diurno',per=/^adm/i.test(String(o['perfil']||''))?'ADMINISTRADOR':(o['perfil']?'LANÇADOR':(p&&p.perfil)||'LANÇADOR');
  const d={matricula:mat,nome,funcao:String(o['funcao']||(p&&p.funcao)||''),turno:tur,perfil:per,ativo:p?p.ativo!==false:true};
  if(senha||!p){d.hash=await hashSenha(mat,senha||mat);d.trocarSenha=true;}
  itens.push(d);}
 return {novos,atual,erros,itens,aplicar:async()=>{for(let i=0;i<itens.length;i+=50)await enfileirar('EQUIPE',{pessoas:itens.slice(i,i+50)},'EQP');}};}

/* ------------------------------ Períodos e filtros ------------------------------ */
const segunda=iso=>{const [y,m,d]=iso.split('-').map(Number),dt=new Date(y,m-1,d);return addDias(iso,-((dt.getDay()+6)%7));};
function periodo(per){per=per||S.per;const t=new Date(),H=hoje();
 if(per==='custom')return [S.dIni||H,S.dFim||H];
 if(per==='hoje')return [H,H];
 if(per==='semana')return [segunda(H),addDias(segunda(H),6)];
 if(per==='mes')return [isoD(new Date(t.getFullYear(),t.getMonth(),1)),isoD(new Date(t.getFullYear(),t.getMonth()+1,0))];
 if(per==='mesAnt')return [isoD(new Date(t.getFullYear(),t.getMonth()-1,1)),isoD(new Date(t.getFullYear(),t.getMonth(),0))];
 if(per==='7d')return [addDias(H,-6),H];
 if(per==='30d')return [addDias(H,-29),H];
 if(per==='90d')return [addDias(H,-89),H];
 const m=t.getMonth()+(t.getDate()>=20?1:0);return [isoD(new Date(t.getFullYear(),m-1,20)),isoD(new Date(t.getFullYear(),m,19))];}
const PERS=[['hoje','Hoje'],['semana','Semana atual'],['mes','Mês atual'],['mesAnt','Mês anterior'],['ciclo','Ciclo atual (20→19)'],['7d','Últimos 7 dias'],['30d','Últimos 30 dias'],['90d','Últimos 90 dias'],['custom','Personalizado (datas)']];
function filtrar(a,b,o={}){const tag=normTag(S.fTag);return regsAtivos().filter(r=>(!a||r.data>=a)&&(!b||r.data<=b)&&(!S.fTurno||r.turno===S.fTurno)&&(!S.fFrente||r.frente===S.fFrente)&&(!tag||r.tag===tag)&&(o.tipo===undefined?(!S.fTipo||r.tipo===S.fTipo):(!o.tipo||r.tipo===o.tipo)));}
function filtrosPainel(){const [a,b]=periodo();
 return `<div class="filtros"><span class="lb">Período</span><select class="mini" data-f="per">${PERS.map(([k,l])=>`<option value="${k}" ${S.per===k?'selected':''}>${l}</option>`).join('')}</select>
 <input type="date" class="mini dt" data-f="dIni" value="${a}" max="${b}"><span class="lb">até</span><input type="date" class="mini dt" data-f="dFim" value="${b}" min="${a}">
 <select class="mini" data-f="fTurno"><option value="">Todos os turnos</option>${TURNOS.map(t=>`<option ${S.fTurno===t?'selected':''}>${t}</option>`).join('')}</select>
 <select class="mini" data-f="fFrente"><option value="">Todas as frentes</option>${frentes().map(f=>`<option ${S.fFrente===f.nome?'selected':''}>${h(f.nome)}</option>`).join('')}</select>
 <input class="mini dt" list="dlTags" data-f="fTag" placeholder="TAG (todas)" value="${h(S.fTag)}" style="width:130px">${dl('dlTags',banheiros().map(b=>b.tag))}

 ${S.fTurno||S.fFrente||S.fTag||S.fTipo?`<button class="btn ghost sm" data-act="limpar-filtros">${ic('x')} Limpar</button>`:''}
 <span class="tiny f1" style="text-align:right">${S.lastSync?'Atualizado '+tempo(S.lastSync):'Ainda não sincronizado'}</span><button class="btn sm" data-act="sync">${ic('sync')} Atualizar</button></div>`;}

/* ------------------------------ Gráficos ------------------------------ */
function niceMax(v){if(v<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(v))),n=v/p;return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p;}
function chartColunas(buckets,series){
 const tot=buckets.map((_,i)=>series.reduce((a,s)=>a+s.vals[i],0)),mx=niceMax(Math.max(1,...tot));
 const passo=Math.ceil(buckets.length/12);
 return `<div class="colchart">${[mx,mx/2].map(v=>`<div class="gl" style="bottom:${v/mx*100}%"><span>${Math.round(v)}</span></div>`).join('')}
  ${buckets.map((b,i)=>`<div class="ccol" data-tip="${h(`<b>${b.tip}</b>`+series.map(s=>`<br><i style='display:inline-block;width:9px;height:9px;border-radius:2px;background:${s.hex}'></i> ${s.nome}: <b>${s.vals[i]}</b>`).join('')+(series.length>1?`<br>Total: <b>${tot[i]}</b>`:''))}"><div class="stack" style="height:${tot[i]/mx*100}%">${tot[i]&&(buckets.length<=45||i%passo===0)?`<span class="cv">${tot[i]}</span>`:''}${series.filter(s=>s.vals[i]).map(s=>`<i style="flex:${s.vals[i]};background:${s.hex}">${series.length>1&&s.vals[i]/mx*200>=15&&buckets.length<=31?`<b>${s.vals[i]}</b>`:''}</i>`).join('')}</div></div>`).join('')}</div>
  <div class="xlab">${buckets.map((b,i)=>`<span>${i%passo===0?b.label:''}</span>`).join('')}</div>`;}
function chartBarrasH(itens,cor){
 if(!itens.length)return `<div class="muted" style="padding:10px 0">Sem dados no período</div>`;
 const mx=Math.max(...itens.map(i=>i.v)),soma=itens.reduce((a,i)=>a+i.v,0),pc=soma&&itens.length>1;
 return itens.map(i=>`<div class="hb ${pc?'hb4':''}" data-tip="${h(`<b>${i.l}</b><br>${i.tip||i.v}`)}"><span class="lb" title="${h(i.l)}">${h(i.l)}</span><span class="tr"><span class="br" style="display:block;width:${mx?i.v/mx*100:0}%;background:${i.cor||cor}"></span></span><span class="vl">${fN(i.v)}</span>${pc?`<span class="hp">${Math.round(i.v/soma*100)}%</span>`:''}</div>`).join('');}
function donut(itens,centro,sub){const tot=itens.reduce((a,i)=>a+i.v,0),R=60,C=2*Math.PI*R;let ac=0;
 const arcs=tot?itens.filter(i=>i.v).map(i=>{const f=i.v/tot,ini=ac;ac+=f;const mid=(ini+f/2)*2*Math.PI-Math.PI/2;
  return `<circle cx="85" cy="85" r="${R}" fill="none" stroke="${i.cor}" stroke-width="28" stroke-dasharray="${f*C} ${C}" stroke-dashoffset="${-ini*C}" transform="rotate(-90 85 85)" data-tip="${h(`<b>${i.l}</b><br>${fN(i.v)} (${Math.round(f*100)}%)`)}"/>${f>=.07?`<text x="${85+R*Math.cos(mid)}" y="${85+R*Math.sin(mid)+4}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${Math.round(f*100)}%</text>`:''}`;}).join(''):`<circle cx="85" cy="85" r="${R}" fill="none" stroke="#e7ebf3" stroke-width="28"/>`;
 return `<div class="donut"><svg viewBox="0 0 170 170">${arcs}<text x="85" y="84" text-anchor="middle" font-size="26" font-weight="800" fill="#141b2b">${centro??fN(tot)}</text><text x="85" y="102" text-anchor="middle" font-size="11" fill="#8a91a0">${h(sub||'total')}</text></svg>
 <div class="dl2">${itens.map(i=>`<div><i style="background:${i.cor}"></i>${h(i.l)}<b>${fN(i.v)}</b><span class="p">${tot?Math.round(i.v/tot*100)+'%':'—'}</span></div>`).join('')}</div></div>`;}
const LEG=s=>`<div class="leg">${s.map(x=>`<span><i style="background:${x.hex}"></i>${x.nome}</span>`).join('')}</div>`;
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function bucketsG(a,b,g){const bk=[];
 if(g==='semana'){let s=segunda(a);while(s<=b){const e=addDias(s,6);bk.push({a:s,b:e,label:fDM(s),tip:`Semana ${fData(s)} a ${fData(e)}`});s=addDias(s,7);}}
 else if(g==='mes'){let [y,m]=a.split('-').map(Number);const [yb,mb]=b.split('-').map(Number);while(y<yb||(y===yb&&m<=mb)){const ini=`${y}-${pad(m)}-01`,fimM=isoD(new Date(y,m,0));bk.push({a:ini,b:fimM,label:`${MESES[m-1]}/${String(y).slice(2)}`,tip:`${MESES[m-1]}/${y}`});m++;if(m>12){m=1;y++;}}}
 else{let s=difDias(a,b)>91?addDias(b,-91):a;while(s<=b){bk.push({a:s,b:s,label:fDM(s),tip:fData(s)});s=addDias(s,1);}}
 return {bk,idx:d=>{for(let i=0;i<bk.length;i++)if(d>=bk[i].a&&d<=bk[i].b)return i;return -1;}};}
function serie(regs,B,nome,hex,fn){const s={nome,hex,vals:B.bk.map(()=>0)};regs.forEach(r=>{if(fn&&!fn(r))return;const i=B.idx(r.data);if(i>=0)s.vals[i]++;});return s;}
const media=a=>{const v=a.map(r=>r.duracaoMin).filter(x=>x>0);return v.length?v.reduce((p,c)=>p+c,0)/v.length:null;};
const kpi=(i,l,v,d,cor,flag)=>`<div class="kpi" style="--c:${cor||'#00379e'}">${flag?`<span class="flag" style="background:${flag}"></span>`:''}<div class="l"><span class="ki">${ic(i)}</span>${l}</div><div class="v">${v}</div><div class="d">${d||''}</div></div>`;
const cmp=(a,b,txt)=>{if(b==null)return txt||'';const d=a-b;return `${d>0?'<span class="up">▲ '+d+'</span>':d<0?'<span class="dn">▼ '+(-d)+'</span>':'='} ${txt}`;};

  if(!await confirmar(`Colocar ${ids.length} banheiro(s) na frente ${fr}?`,'Confirmar'))return;

 'cfg-testar':async()=>{const u=$('#cfgUrl').value.trim();if(!u&&!window.DEMO_API){toast('Informe o endereço','erro');return;}const old={...S.cfg};S.cfg.apiUrl=u;S.cfg.key=$('#cfgKey').value.trim();try{const r=await api({action:'ping'});toast(r.chave&&!r.chaveOk?'Servidor OK, mas a chave está incorreta':'Conexão OK · servidor v'+(r.versao||'?'),r.chave&&!r.chaveOk?'erro':'ok');}catch(e){toast('Falhou: '+e.message,'erro');}finally{S.cfg=old;}},
 'copiar-link':async()=>{try{await navigator.clipboard.writeText($('#lnk').value);toast('Link copiado','ok');}catch(e){$('#lnk').select();toast('Selecione e copie o link');}},
 'instalar':async()=>{if(!S.instalar)return;S.instalar.prompt();await S.instalar.userChoice;S.instalar=null;render();}

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const f=ACOES[el.dataset.act];if(f){e.preventDefault();e.stopPropagation();f(el);}});

root.addEventListener('focusout',e=>{const el=e.target;if(!(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&el.hasAttribute('spellcheck'))))return;
 const nv=corrigirTexto(el.value);if(nv!==el.value){el.value=nv;if(S.tela==='form')onCampoForm({target:el,type:'input'});el.classList.add('corrigido');setTimeout(()=>el.classList.remove('corrigido'),1200);}});
const redesenharBusca=(id,campo)=>e=>{if(e.target.id!==id)return;S[campo]=e.target.value;clearTimeout(S['_t'+id]);S['_t'+id]=setTimeout(()=>{const p=e.target.selectionStart;render();const b=$('#'+id);if(b){b.focus();try{b.setSelectionRange(p,p);}catch(x){}}},250);};
[['stBusca','stBusca'],['banBusca','banBusca'],['eqBusca','eqBusca'],['hBusca','hBusca']].forEach(([i,c])=>root.addEventListener('input',redesenharBusca(i,c)));

 if(t.dataset.h){S[t.dataset.h]=t.dataset.h==='hTag'?normTag(t.value):t.value;if(S.hIni&&S.hFim&&S.hIni>S.hFim)[S.hIni,S.hFim]=[S.hFim,S.hIni];S.hLim=100;render();return;}
 const f=t.dataset.f;if(!f)return;
 if(f==='dIni'||f==='dFim'){if(!t.value)return;const [a,b]=periodo();S.dIni=f==='dIni'?t.value:a;S.dFim=f==='dFim'?t.value:b;if(S.dIni>S.dFim)[S.dIni,S.dFim]=[S.dFim,S.dIni];S.per='custom';render();return;}
 S[f]=f==='fTag'?normTag(t.value):t.value;render();});

/* ------------------------------ Inicialização ------------------------------ */
async function init(){
 try{
  S.deviceId=await getMeta('deviceId');if(!S.deviceId){S.deviceId=uuid();await setMeta('deviceId',S.deviceId);}
  S.cfg=Object.assign(S.cfg,await getMeta('cfg',{}));
  try{const q=new URLSearchParams(location.search),s=q.get('s'),k=q.get('k');let mud=false;if(s&&/^https:\/\//.test(s)&&(!S.cfg.apiUrl||S.cfg.apiUrl===s)){S.cfg.apiUrl=s;mud=true;}if(k&&(!S.cfg.key||S.cfg.apiUrl===s)){S.cfg.key=k;mud=true;}if(mud)await setMeta('cfg',S.cfg);if(s||k)history.replaceState(null,'',location.pathname);}catch(e){}
  S.user=await getMeta('user',null);S.auth=await getMeta('auth',null);S.lastSync=await getMeta('lastSync',null);S.lastPull=await getMeta('lastPull',null);S.seq=await getMeta('seq',0);
  S.equipeSrv=await getMeta('equipe',[]);S.frentesSrv=await getMeta('frentes',[]);S.banheirosSrv=await getMeta('banheiros',[]);S.configSrv=await getMeta('config',{});S.aparelhos=await getMeta('aparelhos',[]);S.fotosIdx=await getMeta('fotosIdx',{});
  S.rascunhos=await getMeta('rascunhos',[]);
  if(window.DEMO_INIT)await window.DEMO_INIT();
  const all=await todos('srv');S.srvRegs=all.filter(x=>x._k==='R');S.srvSins=all.filter(x=>x._k==='S');
  const rest=await restaurarEspelho();await recarregarFila();await recarregarFotosPend();
  const mx=Math.max(0,...S.fila.map(r=>r.seq||0));if(mx>S.seq){S.seq=mx;await setMeta('seq',mx);}
  if(rest)toast(`${rest} item(ns) recuperado(s) da cópia de segurança`,'ok');
 }catch(e){root.innerHTML=`<div class="aviso" style="margin:20px">Erro ao abrir o armazenamento do aparelho: ${h(e.message)}. Não use aba anônima.</div>`;return;}
 try{if(navigator.storage&&navigator.storage.persist){S.persist=await navigator.storage.persisted();if(!S.persist)S.persist=await navigator.storage.persist();}}catch(e){}
 if('serviceWorker' in navigator&&location.protocol.startsWith('http')&&!window.DEMO_API)navigator.serviceWorker.register('sw.js').catch(()=>{});
 S.tela=location.hash==='#vencidos'?'vencidos':(isAdm()?'painel':'lancar');
 render();
 setInterval(()=>{if(S.user)sincronizar();},90000);
 setInterval(()=>{verificarAlertas();if(S.user&&S.tela==='vencidos'&&!document.querySelector('.modal'))redesenharSePuder();},60000);setTimeout(verificarAlertas,4000);
 if(S.user)sincronizar();else if(temServidor()&&!S.equipeSrv.length)sincronizar();
}
init();
